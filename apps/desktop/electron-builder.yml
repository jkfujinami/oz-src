# デスクトップ版の配布パッケージ (npm run dist:mac / dist:win / dist:linux)
#
# ★ コード署名はしない (Apple / Microsoft の開発者アカウントに身元が結び付くため)。
#   macOS は初回に「Apple が確認できない」と出るので、システム設定の「プライバシーとセキュリティ」で
#   「このまま開く」を押してもらう (macOS 14 以前は右クリック →「開く」)。
#   アプリ自体には ad-hoc 署名をかけ直す (scripts/afterPack.cjs。無いと「壊れている」扱いになる)。
# ★ 描画側も main も Vite でまとめてあるので、node_modules は入れない (files に dist だけを並べる)。
appId: org.ozprotocol.oz
productName: OZ
copyright: ""
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png
asar: true
# macOS のアプリに ad-hoc 署名をかけ直す (理由は scripts/afterPack.cjs)
afterPack: scripts/afterPack.cjs
publish: null
# Electron はワークスペースの最上位の node_modules にある (ここからは版を読めない)。入れた版と合わせること
electronVersion: 34.5.8
# ネイティブの依存は無い (すべて Vite でまとめてある)
npmRebuild: false

mac:
  category: public.app-category.social-networking
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  # 空白の無いファイル名にする (リリースに載せると空白が . に変わり、SHA256SUMS.txt と名前がずれるため)
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 作業後にインストール先などの痕跡を残しにくくするため、スタートメニュー以外のショートカットは作らない
  createDesktopShortcut: false

linux:
  category: Network
  target:
    - target: AppImage
      arch: [x64]
