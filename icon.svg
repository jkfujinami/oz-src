<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="100%">
  <defs>
    <!-- くり抜き用のマスク定義 -->
    <mask id="cutout-mask">
      <rect width="100%" height="100%" fill="#ffffff" />
      <circle cx="320" cy="198" r="108" fill="#000000" />
      <polyline points="266,380 380,380 245,560 404,560" fill="none" stroke="#000000" stroke-width="14.5" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" />
    </mask>
  </defs>

  <!-- マスクを適用したメイン図形 -->
  <g fill="#ba327b" mask="url(#cutout-mask)">
    <circle cx="320" cy="198" r="162" />
    <polygon points="229,329 411,329 460,617 180,617" />
  </g>
</svg>