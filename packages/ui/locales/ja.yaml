# 画面の文言 (日本語・既定の言語)。直したら `npm run i18n -w @oz/ui` で src/i18n/messages.gen.ts を作り直す。
#
#   キー      画面.部品 の形 (英数字と _ を . でつなぐ)。ほかの言語の YAML も同じキーで書く
#   差し込み  {name}。コードから t('key', { name: … }) で渡す
#   複数形    { one: …, other: … } の表 (other は必須・{count} を含む)。日本語はふつう文字列だけでよい
#   部品の印  <link>…</link>・<br/>。tRich('key', { link: (c) => … }) で部品に置き換える。HTML は書かない

