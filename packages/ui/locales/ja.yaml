    p2: "本ソフトウェアの利用が法令により禁止または制限されている国または地域では、本ソフトウェアを利用しないでください。"
    p3: "未成年の方は、親権者などの法定代理人の同意を得たうえで本ソフトウェアを利用してください。"
    p4: "利用者は、本ソフトウェアの利用およびコンテンツについて、自らの責任を負うものとします。"
  a3:
    heading: "第3条（禁止事項）"
    p1: "利用者は、本ソフトウェアの利用にあたり、次の行為をしてはなりません。"
    item1: "著作権、著作隣接権、商標権その他の知的財産権を侵害する行為。権利者の許諾を得ずに、映画、音楽、アニメ、漫画、書籍、ゲーム、ソフトウェアその他の著作物をアップロード、共有または送信可能な状態にする行為、および違法にアップロードされたものと知りながらダウンロードする行為を含みます。"
    item2: "児童ポルノ、わいせつな情報その他、法令により所持、頒布または公開が禁止されている情報を送信、共有または保存する行為"
    item3: "他人の名誉または信用を傷つける行為、他人のプライバシーまたは肖像権を侵害する行為、および個人情報を本人の同意なく公開する行為"
    item4: "脅迫、嫌がらせ、差別を助長する行為、犯罪の予告その他、他人に危害を加え、または加えるおそれのある行為"
    item5: "詐欺、違法な薬物や武器の取引、マネー・ローンダリングその他の犯罪行為、およびこれらを助長し、または手助けする行為"
    item6: "コンピュータウイルスなどの有害なプログラムを送信または共有する行為、不正アクセス行為、および他人の端末やネットワークの正常な動作を妨げる行為"
    item7: "本ソフトウェア、他の利用者が運用する中継またはファイル置き場その他の外部サービスに過度の負荷をかける行為、およびそれらのサービスの利用規約に違反する行為"
    item8: "その他、法令または公序良俗に違反する行為、またはそのおそれのある行為"
  a4:
    heading: "第4条（外部サービスの利用）"
    p1: "本ソフトウェアは、トラッカー、STUN サーバー、Cloudflare Workers、公開のファイル置き場など、第三者が提供するサービスを利用します。利用者は、これらのサービスの利用規約を自ら確認し、遵守するものとします。"
    p2: "開発者は、これらのサービスの内容、可用性およびデータの取り扱いについて、責任を負いません。"
  a5:
    heading: "第5条（中継および Guard としての動作）"
    p1: "本ソフトウェアは、その仕組み上、利用者の端末を通じて他の利用者の暗号化された通信を中継します。また、利用者が設定した場合には、他の利用者の最初の中継点（Guard）として動作します。"
    p2: "中継される通信は暗号化されており、中継する利用者も開発者も、その内容を知ることはできません。利用者は、この仕組みを理解したうえで本ソフトウェアを利用するものとします。"
    p3: "Guard として動作させる場合や中継用の Worker を運用する場合、利用者は自らの判断と責任において行うものとします。"
  a6:
    heading: "第6条（権利侵害の申告）"
    p1: "開発者は、ネットワーク上のコンテンツを削除する手段を持っていません。権利を侵害するコンテンツを見つけた場合は、そのコンテンツを保存しているファイル置き場の運営者、または警察などの適切な窓口にご相談ください。"
  a7:
    heading: "第7条（無保証）"
    p1: "本ソフトウェアは現状のまま提供されます。開発者は、本ソフトウェアに不具合や脆弱性がないこと、匿名性や秘匿性が確保されること、データが失われないこと、特定の目的に適合することなどについて、明示または黙示を問わず、いかなる保証もいたしません。"
  a8:
    heading: "第8条（免責）"
    p1: "開発者は、本ソフトウェアを利用したこと、または利用できなかったことにより利用者または第三者に生じた損害（データの消失、身元の特定、法的な紛争などを含みます）について、責任を負いません。ただし、開発者の故意または重大な過失による場合は、この限りではありません。"
    p2: "本ソフトウェアの利用またはコンテンツに関して、利用者と他の利用者または第三者との間で紛争が生じた場合、利用者は自らの責任と費用でこれを解決するものとし、開発者は関与しません。"
    p3: "利用者が本規約に違反したことにより、または本ソフトウェアの利用に関して、開発者が第三者から請求を受け、または損害を被った場合、利用者はその損害（合理的な弁護士費用を含みます）を賠償するものとします。"
  a9:
    heading: "第9条（ソフトウェアのライセンス）"
    p1: "本ソフトウェアの複製、改変および再頒布の条件は、本ソフトウェアに付属する MIT ライセンスに従います。"
  a10:
    heading: "第10条（本規約の変更）"
    p1: "開発者は、必要に応じて本規約を変更することがあります。変更後の本規約は、本ソフトウェアまたは配布ページに掲載した時点から効力を生じます。"
    p2: "本規約を変更した場合、本ソフトウェアは利用者に改めて同意を求めます。"
  a11:
    heading: "第11条（準拠法および管轄裁判所）"
    p1: "本規約は日本法に準拠し、日本法に従って解釈されます。"
    p2: "本規約または本ソフトウェアに関して紛争が生じた場合は、開発者の住所地を管轄する地方裁判所を第一審の専属的合意管轄裁判所とします。"
  dateLabel: "{year}年{month}月{day}日 制定"

about:
  title: "仕組みと安全性"
  safetyTitle: "守れること・守れないこと"
  route:
    title: "匿名経路"
    intro: "送信データは、あなた → Guard (直接接続する第 1 ホップ) → M1 (Guard 先の中継ピア) による 2 段の暗号経路を経由します。データは 1,200 バイト固定長のセルに分割され、全ノードが常時送出しているダミーセルに混入させて送信されます。"
    li1: "Guard に見えるのは、あなたの IP アドレス、セルを通信している事実、およびその通信量のみです。ダミーセルが混ざるため、実際のデータ送信タイミングは特定されません。"
    li2: "M1 に見えるのは通信の宛先 (取得先 URL 等) と手前の Guard だけであり、あなたの IP アドレスは伝達されません。"
    li3: "Guard と M1 の双方が同一の攻撃者に掌握されている場合、あなたと送信先が結び付きます (Tor と同様の構造的限界)。信頼 Guard を設定することで、この結託リスクを低減できます。"
    li4: "掲示板の投稿は M1 の先でさらに複数のピアを経由して P2P ネットワーク全体へ拡散されるため、最初にネットワークへ流出させたノードとしてあなたや Guard が特定されることはありません。"
    li5: "Guard と M1 には、あなたと同じネットワーク (同一 LAN・同一パブリック IP) のノードは選定されません。1 台の端末で複数のノードを起動しても自身のノードのみで経路が構成されることはなく、外部ピアが発見されるまで「匿名経路を準備中」の待機状態となります。"
  ozzy:
    title: "ファイル共有 (Ozzy)"
    intro: "共有ファイルは端末内で暗号化して 64 MiB ごとのストライプに分割され、Reed-Solomon 符号により 32 個のシェア (任意の 16 個から元通り復元可能) に冗長化して複数の公開ファイルロッカーへ分散配置されます。一部のロッカーが削除・停止しても安全に取り出せます。"
    li1: "ロッカーへのアップロードおよびダウンロードは、本端末ではなくオニオン回路先の M1 中継ノードが代理実行します。M1 は他の参加者が提供する中継 Worker を通してロッカーへアクセスするため、ロッカーにも Worker にもあなたの IP アドレスは届きません。回路が確立できないときは処理を中断し、直接通信することはありません。"
    li2: "アップロード直後に別経路からダウンロードを試行し、正常に配置されたかを即座に検証します。取得したシェアはハッシュ値で検証され、不正なデータを返したノードは自動的に排除されます。"
    li3: "配置情報（Manifest）は暗号化されて P2P ストレージに分散保持され、共有リンク <code>[[ozzy:v3:…]]</code> 自体がその復号鍵となります。中央サーバーや公開ディレクトリは使用しません。"
    li4: "Guard ノードには、アップロードされた総通信量が観測されます (誤り訂正パリティを含むため、ファイル実サイズの約 2 倍となります)。"
    li5: "公開ロッカーはファイルの自主削除や保存期限切れが発生する場合がありますが、全体の半分（最大 16/32 シェア）が消失しても元のファイルを完全に復元できます。"
    li6: "Internet Archive は使用しません。個人アカウントでのアップロードが必要となり、アカウント情報から身元が特定されるリスクがあるためです。"
    li7: "保存先を Gatekeeper Worker に指定した場合、Gatekeeper と直接通信するため、Worker 側のアクセスログにあなたの IP アドレスが記録されます。"
  worker:
    title: "中継 Worker"
    intro: "ファイル共有を利用する場合、Cloudflare Workers 上に中継用 Worker を各自 1 つデプロイします。デプロイした Worker は、他の参加者の中継ノード (M1) がロッカーへアクセスする際のプロキシとして相互利用されます。Worker の URL は P2P ネットワーク経由で他の参加者に共有されます。"
    step1: "Cloudflare アカウントを作成します。本名や普段利用しているメールアドレスと結び付かないアカウントとし、workers.dev のサブドメインにも身元が推測されない名前を設定してください。"
    step2: "配布ページ (<code>https://github.com/jkfujinami/Oz/releases/latest</code>) から <code>OZ-worker-<版>.zip</code> をダウンロードし、同梱の README.txt の手順で Worker をデプロイします。Cloudflare の管理画面にコードを貼り付ける方法であれば、追加ツールのインストールやクレジットカードの登録は不要です。"
    step3: "発行された <code>https://….workers.dev</code> の URL を、「設定」→「ファイル共有」に登録します。"

security:
  canTitle: "守れること"
  can1: "P2P ネットワーク上の観測者 (ピア・中継ノード・保管ノード) に対し、「どの投稿を誰が書いたか」を秘匿します。投稿はダミー通信に多重混入された暗号化経路経由で送信されます。"
  can2: "本端末に保存されるデータ (投稿履歴・板の暗号鍵など) はパスワードで暗号化されます。推測されにくい十分な長さのパスワードであれば、ロック中や電源オフ時に押収されても読み取れません。"
  can3: "板の鍵を持たない第三者には、投稿本文は読み取れません。"
  cannotTitle: "守れないこと"
  cannot1: "OZ を使っていること自体。あなたの IP アドレスは接続先の端末、トラッカーの運営者、通信事業者 (ISP)、STUN の運営者 (既定では Google と Cloudflare) から見えます。端末に OZ が入っていることも隠せません。"
  cannot2: "国全体の通信を監視できる相手。そのような環境での告発には使わないでください。"
  cannot3: "職場など所属組織のネットワークや端末からの利用。組織内の調査では、利用者であること自体から特定され得ます。"
  cannot4: "ロックを解除した状態での端末の押収・物理アクセス。離席時は必ずロックしてください。"
  cannot5: "トリップを使った投稿同士は、同じ人物のものとして紐付きます。"
  cannot6: "投稿本文に含まれる情報 (関係者しか知り得ない事実、特有の文体など) からの特定。"

